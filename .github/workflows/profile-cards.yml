name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

env:
  # Uses the PROFILE_STATS_TOKEN secret (PAT) if it exists; otherwise falls back
  # to the built-in token, which only sees public data.
  STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # ---------- Stats ----------
      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&theme=default
          path: profile/stats.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&theme=tokyonight
          path: profile/stats-dark.svg
          token: ${{ env.STATS_TOKEN }}

      # ---------- Streak ----------
      - name: Streak (light)
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&theme=default&hide_border=true
          path: profile/streak.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak-dark.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git pull --rebase
          git push
